<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration From</title>
  </head>
  <body>
    <header>
      <h1>Student Registration From</h1>
    </header>

    <form>
      <label for="name">Student Name:</label><br />
      <input type="text" id="Name" name="Student Name" /><br /><br />
      <label for="email">Email:</label><br />
      <input type="email" id="Email" name="Email" /><br /><br />
      <label for="Number">Phone Number:</label><br />
      <input type="phone" id="phone Number" phone="Number" /><br /><br />

      <label>Gender</label><br />
      <input type="radio" id="male" name="Gender" value="Male" />
      <label for="male">Male</label>
      <input type="radio" id="Female" name="Gender" value="Female" />
      <label for="Female">Female</label>
      <input type="radio" id="Other" name="Gender" value="Other" />
      <label for="other">Other</label><br /><br />

      <label>Course</label><br />
      <select name="Course">
        <option value="html">Html</option>
        <option value="css">css</option>
        <option value="JavaScript">JavaScript</option></select
      ><br /><br />
      <textarea
        rows="5"
        cols="40"
        placeholder="Enter your message ...."
      ></textarea
      ><br /><br />

      <label for="photo">upload photo</label>
      <input type="file" id="photo" name="photo" /><br /><br />

      <label>Terms</label>
      <label for="terms">I agree to the terms & conditions</label>
      <input type="checkbox" id="terms" required /><br /><br />
      <div>
        <label>Sumbit</label>
        <button type="submit">Submit</button>
        <label>Reset</label>
        <button type="reset">Reset</button>
      </div>
    </form>
  </body>
</html>
